<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ideias Vitalícias, Lda</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #0f172a;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 48px 56px;
      max-width: 480px;
      width: 100%;
      margin: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 32px;
    }
    .section {
      margin-bottom: 24px;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .value {
      font-size: 0.9375rem;
      color: #0f172a;
      line-height: 1.5;
    }
    a {
      color: #1e40af;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 28px 0;
    }
    .product {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .product-name {
      font-size: 0.9375rem;
      font-weight: 600;
    }
    .product-desc {
      font-size: 0.8125rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ideias Vitalícias, Lda</h1>
    <p class="tagline">Empresa de desenvolvimento de software</p>

    <div class="section">
      <p class="label">Morada</p>
      <p class="value">Rua Serpa Pinto 74<br>2950-218 Palmela<br>Portugal</p>
    </div>

    <div class="section">
      <p class="label">Contacto</p>
      <p class="value"><a href="mailto:contact@ideiasvitalicias.pt">contact@ideiasvitalicias.pt</a></p>
    </div>

    <hr class="divider" />

    <div class="section">
      <p class="label">Produto</p>
      <div class="product">
        <div>
          <p class="product-name">Nerivo</p>
          <p class="product-desc">Gestão de despesas para freelancers e pequenas empresas — <a href="https://nerivo.app">nerivo.app</a></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
